[project]
name = "carecompass"
version = "1.0.0"
description = "A holistic health companion with AI chat, healthcare finder, and meal planning"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "google-genai>=1.0.0",
    "httpx>=0.26.0",
    "itsdangerous>=2.1.2",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.6",
    "uvicorn>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
]
